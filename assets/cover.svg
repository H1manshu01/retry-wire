<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="4" fill="#e3b341"/>

  <text x="56" y="150" font-size="54" font-weight="700" fill="#e6edf3">retry<tspan fill="#e3b341">-wire</tspan></text>
  <text x="58" y="192" font-size="18" fill="#c9d1d9">Provider-aware retry for LLM calls</text>
  <text x="58" y="222" font-size="15" fill="#8b949e">429, 529 overloaded, Retry-After, backoff</text>

  <g font-size="15" fill="#c9d1d9">
    <rect x="56" y="256" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="131" y="278" text-anchor="middle">zero-dependency</text>
    <rect x="216" y="256" width="186" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="309" y="278" text-anchor="middle">OpenAI + Anthropic</text>
    <rect x="412" y="256" width="92" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="458" y="278" text-anchor="middle">~1.7 kB</text>
  </g>

  <text x="58" y="344" font-size="18"><tspan fill="#e3b341">$</tspan> <tspan fill="#c9d1d9">npm install retry-wire</tspan></text>

  <rect x="512" y="56" width="432" height="308" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="512" y="56" width="432" height="38" rx="12" fill="#161b22"/>
  <rect x="512" y="82" width="432" height="12" fill="#161b22"/>
  <circle cx="534" cy="75" r="5.5" fill="#ff5f56"/>
  <circle cx="553" cy="75" r="5.5" fill="#ffbd2e"/>
  <circle cx="572" cy="75" r="5.5" fill="#27c93f"/>
  <text x="728" y="80" text-anchor="middle" font-size="12" fill="#8b949e">POST /v1/chat/completions</text>

  <text x="532" y="128" font-size="13" fill="#6e7681">// survive 429 + 529 overload, any client</text>
  <text x="532" y="156" font-size="14" fill="#e3b341">retryFetch(fetch, { provider })</text>

  <text x="532" y="194" font-size="13"><tspan fill="#ffa657">429</tspan><tspan fill="#8b949e"> rate limit</tspan><tspan fill="#e3b341">  → wait 2s</tspan><tspan fill="#6e7681"> (Retry-After)</tspan></text>
  <text x="532" y="222" font-size="13"><tspan fill="#ffa657">529</tspan><tspan fill="#8b949e"> overloaded</tspan><tspan fill="#e3b341">  → wait 1.2s</tspan><tspan fill="#6e7681"> (backoff)</tspan></text>
  <text x="532" y="250" font-size="13"><tspan fill="#3fb950">200</tspan><tspan fill="#8b949e"> OK</tspan><tspan fill="#3fb950">  ✓</tspan></text>

  <text x="532" y="296" font-size="13"><tspan fill="#3fb950">✓ recovered</tspan><tspan fill="#6e7681">  ·  after 2 retries</tspan></text>
</svg>
