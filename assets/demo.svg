<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="retry-wire retrying an LLM request through a 429 and a 529 overload until it succeeds">
  <defs>
    <style>
      .fn  { fill: #e3b341; }
      .p   { fill: #8b949e; }
      .c   { fill: #6e7681; }
      .warn{ fill: #ffa657; }
      .ok  { fill: #3fb950; }
      .t   { font-size: 14px; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="430" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="720" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="720" height="12" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="360" y="25" text-anchor="middle" font-size="13" fill="#8b949e">POST /v1/chat/completions</text>

  <rect width="0" height="0">
    <animate id="loop" attributeName="width" begin="0s;loop.end" dur="7.6s" values="0;0"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+0.2s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t c" x="28" y="82">// survive rate limits and overloads, with any client</text>
    <text class="t fn" x="28" y="110">retryFetch(fetch, { provider: "openai" })</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+1.3s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t" x="28" y="152"><tspan class="p">POST  →  </tspan><tspan class="warn">429 rate limit</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+2.0s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t fn" x="48" y="180">↻ wait 2000ms <tspan class="c">(Retry-After)</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+2.7s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t" x="28" y="212"><tspan class="p">POST  →  </tspan><tspan class="warn">529 overloaded</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+3.4s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t fn" x="48" y="240">↻ wait 1180ms <tspan class="c">(backoff + jitter)</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+4.1s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t" x="28" y="272"><tspan class="p">POST  →  </tspan><tspan class="ok">200 OK  ✓</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="loop.begin+4.8s" dur="0.2s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loop.begin+7.2s" dur="0.2s" to="0" fill="freeze"/>
    <text class="t" x="28" y="310"><tspan class="ok">✓ recovered</tspan><tspan class="c">  ·  after 2 retries, no lost request</tspan></text>
  </g>

  <rect x="28" y="332" width="9" height="18" fill="#e3b341">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text class="t c" x="44" y="346">retryFetch(fetch, { provider, maxRetries })</text>
</svg>
