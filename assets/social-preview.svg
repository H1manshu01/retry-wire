<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#e3b341"/>

  <text x="80" y="250" font-size="70" font-weight="700" fill="#e6edf3">retry<tspan fill="#e3b341">-wire</tspan></text>
  <text x="82" y="304" font-size="25" fill="#c9d1d9">Provider-aware retry for LLM API calls</text>
  <text x="82" y="340" font-size="19" fill="#8b949e">429, 529 overloaded, Retry-After, backoff</text>

  <g font-size="18" fill="#c9d1d9">
    <rect x="80" y="376" width="196" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="404" text-anchor="middle">zero-dependency</text>
    <rect x="288" y="376" width="224" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="400" y="404" text-anchor="middle">OpenAI + Anthropic</text>
    <rect x="524" y="376" width="118" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="583" y="404" text-anchor="middle">~1.7 kB</text>
  </g>

  <text x="82" y="508" font-size="25"><tspan fill="#e3b341">$</tspan> <tspan fill="#c9d1d9">npm install retry-wire</tspan></text>

  <rect x="700" y="96" width="500" height="448" rx="14" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="700" y="96" width="500" height="46" rx="14" fill="#161b22"/>
  <rect x="700" y="128" width="500" height="14" fill="#161b22"/>
  <circle cx="726" cy="119" r="6.5" fill="#ff5f56"/>
  <circle cx="748" cy="119" r="6.5" fill="#ffbd2e"/>
  <circle cx="770" cy="119" r="6.5" fill="#27c93f"/>
  <text x="975" y="124" text-anchor="middle" font-size="14" fill="#8b949e">POST /v1/chat/completions</text>

  <text x="724" y="190" font-size="15" fill="#6e7681">// survive 429 + 529 overload, any client</text>
  <text x="724" y="224" font-size="17" fill="#e3b341">retryFetch(fetch, { provider })</text>

  <text x="724" y="266" font-size="16"><tspan fill="#ffa657">429</tspan><tspan fill="#8b949e"> rate limit</tspan><tspan fill="#e3b341">  → wait 2s</tspan><tspan fill="#6e7681"> (Retry-After)</tspan></text>
  <text x="724" y="300" font-size="16"><tspan fill="#ffa657">529</tspan><tspan fill="#8b949e"> overloaded</tspan><tspan fill="#e3b341">  → wait 1.2s</tspan><tspan fill="#6e7681"> (backoff)</tspan></text>
  <text x="724" y="334" font-size="16"><tspan fill="#3fb950">200</tspan><tspan fill="#8b949e"> OK</tspan><tspan fill="#3fb950">  ✓</tspan></text>

  <text x="724" y="400" font-size="15"><tspan fill="#3fb950">✓ recovered</tspan><tspan fill="#6e7681">  ·  after 2 retries, no lost request</tspan></text>
</svg>
